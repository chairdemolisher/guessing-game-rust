name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: guessinggame ${{ github.ref_name }}
          generate_release_notes: true

  build_release:
    name: Build ${{ matrix.asset }}
    needs: create_release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: guessinggame-linux-x86_64
            binary: target/release/guessinggame
          - os: macos-latest
            asset: guessinggame-macos-arm64
            binary: target/release/guessinggame
          - os: windows-latest
            asset: guessinggame-windows-x86_64.exe
            binary: target/release/gussinggame
    runs-on: ${{ matrix.os }}
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release

      - name: Rename output
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.asset }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
